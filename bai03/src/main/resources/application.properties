spring.application.name=incident-etl-defensive-refactor

# In-memory H2 Database for local runtime demonstration & tests
spring.datasource.url=jdbc:h2:mem:incident_etl;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging Level
logging.level.com.logistics.etl=DEBUG
